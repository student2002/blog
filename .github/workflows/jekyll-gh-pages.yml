name: Build & Deploy
on:
  push:
    branches: [main]  # 触发分支
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
      - run: npm install
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 每次部署都把自定义域名写回 gh-pages 分支，否则 force push 会把 CNAME 冲掉，
          # zhenfeng.chat 就会变成 404（github.io/blog 仍然正常）
          cname: zhenfeng.chat
